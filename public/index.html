<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="chat">
  <header class="top">
    <span class="dot"></span>
    <div><strong>Mia</strong><small>online</small></div>
  </header>
  <section id="log" class="log" aria-live="polite"></section>
  <div id="chip" class="chip" hidden><span id="chipName"></span><button id="chipX" aria-label="Remove file">×</button></div>
  <form id="form" class="composer">
    <label class="clip" title="Attach a file" aria-label="Attach a file">
      <input id="file" type="file" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.3-8.3"/></svg>
    </label>
    <input id="text" type="text" placeholder="Type a message" autocomplete="off">
    <button class="send" type="submit" aria-label="Send">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20.5v-17L21.5 12 3 20.5zm2-3.2L16.3 12 5 6.7v3.8l6 1.5-6 1.5v3.8z"/></svg>
    </button>
  </form>
</main>
<script src="app.js"></script>
</body>
</html>
